<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    /* Светлая тема: мягкий тёмно-угольный цвет вместо агрессивного черного */
    circle { fill: #2D3139; }

    /* Темная тема: приглушенный Space Silver / Titanium */
    @media (prefers-color-scheme: dark) {
      circle { fill: #C5CBD3; }
    }
  </style>
  <!-- Большой круг -->
  <circle cx="36" cy="62" r="32" />
  <!-- Средний круг -->
  <circle cx="76" cy="24" r="16" />
  <!-- Маленький круг -->
  <circle cx="82" cy="80" r="10" />
</svg>
